<style>
  .wx { max-width: 760px; padding-bottom: 40px; }

  .now .mm b { font-weight: 800; }
  .now .rain { grid-column: 1 / -1; margin-top: 14px; background: var(--bg); border-radius: var(--r-sm); padding: 11px 14px; font-size: 15px; font-weight: 700; display: flex; gap: 10px; align-items: center; }

  /* 칩 */

  .hgrid { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 58px; }

  .hcol .h.day { color: var(--moss-dark); }
  .hcol.first::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; border-left: 1px dashed var(--line); }
  .hcol img { width: 34px; height: 34px; margin: 6px auto 0; }

  .hline { position: absolute; left: 0; top: 60px; height: 74px; pointer-events: none; overflow: visible; }
  .hline text { font: 800 14px var(--font); fill: var(--ink); text-anchor: middle; }
  .hlabels { display: grid; grid-template-columns: 1fr; position: absolute; }

  /* 날짜별 */
  .days { list-style: none; margin: 0; padding: 0; }
  .days li { display: grid; grid-template-columns: 74px 1fr 1fr minmax(110px, 1.4fr); align-items: center; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line); }
  .days li:first-child { border-top: 0; padding-top: 2px; }
  .days .d b { display: block; font-size: 16px; } .days .d small { color: var(--ink-3); font-size: 12.5px; }
  .days .d.sun b { color: #E03131; } .days .d.sat b { color: #1C7ED6; }
  .days .half { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-3); font-weight: 700; }
  .days .half img { width: 30px; height: 30px; }
  .days .half em { font-style: normal; width: 34px; }
  .days .half em.hi { color: #1C7ED6; }
  .days .tr { display: grid; grid-template-columns: 30px 1fr 30px; align-items: center; gap: 6px; font-weight: 800; font-size: 15px; }
  .days .tr .lo { color: #1C7ED6; text-align: right; } .days .tr .hi2 { color: #E03131; }
  .days .bar { position: relative; height: 6px; border-radius: 3px; background: var(--bg-2); }
  .days .bar i { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: linear-gradient(90deg, #4DABF7, #FFA94D); }
  .days .half small { font-size: 11px; color: var(--ink-3); font-weight: 600; display: none; }
  @media (max-width: 420px) { .days li { grid-template-columns: 58px 1fr 1fr 96px; } .days .tr { grid-template-columns: 26px 1fr 26px; font-size: 14px; } }

  /* 공기 */
  .air { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  @media (min-width: 640px) { .air { grid-template-columns: repeat(4, 1fr); } }
  .air div { border-radius: var(--r-sm); padding: 12px 14px; background: var(--bg); }
  .air small { display: block; font-size: 12.5px; font-weight: 700; color: var(--ink-3); }
  .air b { display: block; font-size: 20px; font-weight: 800; margin-top: 2px; }
  .air span { font-size: 12.5px; color: var(--ink-3); }
  .g1 { color: #1C7ED6; } .g2 { color: #0E8A5A; } .g3 { color: #E8590C; } .g4 { color: #E03131; }
  .air div.g1 { background: #E7F1FF; } .air div.g2 { background: var(--moss-tint); } .air div.g3 { background: #FFF0E6; } .air div.g4 { background: #FFE9E9; }

  .wx-src { color: var(--ink-3); font-size: 12.5px; line-height: 1.6; margin-top: 6px; }
  .wx-src a { color: var(--ink-2); }
</style>

<script src="app.js"></script>
<script>
(() => {
  const LAT = 37.185, LNG = 127.206;  // 이동읍 가게들의 가운데(기상청 격자 64,118과 같은 칸) — 일출·일몰 계산용
  const DAYS = "일월화수목금토";
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const num = v => (v == null || v === "" || isNaN(parseFloat(v))) ? null : parseFloat(v);
  const kst = () => { const n = new Date(); return new Date(n.getTime() + (n.getTimezoneOffset() + 540) * 60000); };
  const ymd = d => d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0");
  const dateOf = s => new Date(+s.slice(0, 4), +s.slice(4, 6) - 1, +s.slice(6, 8));
  const icon = (name, alt = "") => `<img src="img/emoji/${name}.webp" alt="${esc(alt)}" width="128" height="128" loading="lazy">`;
  const SKY = { 1: "맑음", 3: "구름많음", 4: "흐림" };
  const PTY = { 1: "비", 2: "비/눈", 3: "눈", 4: "소나기", 5: "빗방울", 6: "빗방울·눈날림", 7: "눈날림" };
  const DIR = "북,북북동,북동,동북동,동,동남동,남동,남남동,남,남남서,남서,서남서,서,서북서,북서,북북서".split(",");
  const arrow = vec => `<svg viewBox="0 0 16 16" aria-hidden="true" style="transform:rotate(${(+vec + 180) % 360}deg)"><path d="M8 1.5 12.5 13 8 10.4 3.5 13Z" fill="currentColor"/></svg>`;

  // 일출·일몰(NOAA 간이식, 오차 1~2분). 기상청·천문연 값이 아니라 계산값이라고 출처에 적는다
  function sun(d) {
    const rad = Math.PI / 180, n = Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(2000, 0, 1, 12)) / 864e5) + 1;
    const J = n - LNG / 360, M = (357.5291 + .98560028 * J) % 360, C = 1.9148 * Math.sin(M * rad) + .02 * Math.sin(2 * M * rad) + .0003 * Math.sin(3 * M * rad);
    const L = (M + C + 180 + 102.9372) % 360, Jt = 2451545 + J + .0053 * Math.sin(M * rad) - .0069 * Math.sin(2 * L * rad);
    const dec = Math.asin(Math.sin(L * rad) * Math.sin(23.44 * rad));
    const w = Math.acos((Math.sin(-.833 * rad) - Math.sin(LAT * rad) * Math.sin(dec)) / (Math.cos(LAT * rad) * Math.cos(dec))) / rad;
    const toKst = jd => { const m = ((jd - 2440587.5) * 864e5 + 9 * 36e5) % 864e5 / 6e4; return Math.round((m + 1440) % 1440); };
    return { rise: toKst(Jt - w / 360), set: toKst(Jt + w / 360) };
  }
  const hhmm = m => String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");

  // 하늘·강수형태 → 아이콘. 해가 진 뒤 맑음은 달, 구름많음은 구름
  function wxIcon(sky, pty, night) {
    pty = String(pty ?? "0");
    if (["1", "4", "5"].includes(pty)) return ["w-rain", PTY[pty]];
    if (["2", "3", "6", "7"].includes(pty)) return ["w-snow", PTY[pty]];
    sky = String(sky ?? "");
    if (sky === "1") return [night ? "w-moon" : "w-sun", "맑음"];
    if (sky === "3") return [night ? "w-cloud" : "w-suncloud", "구름많음"];
    if (sky === "4") return ["w-cloud", "흐림"];
    return ["w-cloud", ""];
  }
  // 중기예보는 하늘을 글로 준다(맑음·구름많음·흐림, 뒤에 비·눈·비/눈·소나기)
  const wfIcon = wf => [/눈/.test(wf) ? "w-snow" : /비|소나기/.test(wf) ? "w-rain" : /흐림/.test(wf) ? "w-cloud" : /구름/.test(wf) ? "w-suncloud" : "w-sun", wf];
  const isNight = (d, h) => { const s = sun(dateOf(d)), m = +h.slice(0, 2) * 60; return m < s.rise || m >= s.set; };
  const whenLabel = (d, h) => {
    const today = ymd(kst()), tmr = ymd(new Date(kst().getTime() + 864e5)), hh = +h.slice(0, 2) + "시";
    if (d === today) return "오늘 " + hh;
    if (d === tmr) return "내일 " + hh;
    const x = dateOf(d); return `${x.getDate()}일(${DAYS[x.getDay()]}) ${hh}`;
  };
  const GRADE_CLASS = { "좋음": "g1", "보통": "g2", "나쁨": "g3", "매우나쁨": "g4" };

  fetch("data/today.json", { cache: "no-store" }).then(r => r.json()).then(T => {
    const S = T.sources || {}, W = S.weather || {}, w = W.data || {}, A = (S.air || {}).data, al = ((S.alerts || {}).data || {}).items || [];
    const age = W.at ? (Date.now() - Date.parse(W.at)) / 36e5 : 999;
    $("meta").textContent = (age > 3 ? "오래된 자료 · " : "") + "기상청 동네예보 · 이동읍 기준 · " + (W.at ? W.at.slice(5, 10).replace("-", ".") + " " + W.at.slice(11, 16) + " 갱신" : "");
    if (age > 3) $("meta").className = "stale";
    if (al.length) { $("alert").textContent = (/특보|주의보|경보/.test(al[0]) ? "" : "기상특보 · ") + al.join(" / "); $("alert").hidden = false; }

    const k = kst(), today = ymd(k);
    const hourly = (w.hourly || []);
    const nw = w.now || {};
    const t = num(nw.t1h ?? w.temp);
    const first = hourly[0] || {};
    const night = isNight(today, String(k.getHours()).padStart(2, "0") + "00");
    const [ic, skyWord] = wxIcon(first.sky, nw.pty && nw.pty !== "0" ? nw.pty : first.pty, night);
    const yd = num(w.yday_temp), diff = t != null && yd != null ? Math.round((t - yd) * 10) / 10 : null;
    const d0 = (w.days || []).find(d => d.date === today) || {};

    // 앞으로 48시간 비·눈: 처음 내리는 시각, 없으면 강수확률이 가장 높은 때
    const soon = hourly.slice(0, 48);
    const wet = soon.find(h => h.pty && h.pty !== "0");
    const peak = soon.reduce((a, h) => (+h.pop || 0) > (+a?.pop || 0) ? h : a, null);
    let rain;
    if (nw.pty && nw.pty !== "0") rain = [`지금 ${PTY[nw.pty] || "비"}가 와요` + (num(nw.rn1) ? ` · 1시간 ${nw.rn1}mm` : ""), true];
    else if (wet) rain = [`${whenLabel(wet.d, wet.h)}부터 ${PTY[wet.pty] || "비"} 예보 · 강수확률 ${wet.pop}%`, true];
    else if (peak && +peak.pop >= 50) rain = [`${whenLabel(peak.d, peak.h)} 강수확률 ${peak.pop}%`, true];
    else rain = ["앞으로 이틀 동안 비 소식 없어요", false];

    $("now").innerHTML = icon(ic, skyWord) +
      `<div><div class="t num">${t != null ? Math.round(t) : "–"}<sup>°</sup></div>
        <div class="s">${esc(skyWord || w.sky || "")}${diff != null && diff !== 0 ? ` · 어제보다 <span class="${diff > 0 ? "up" : "down"}">${Math.abs(diff)}° ${diff > 0 ? "높아요" : "낮아요"}</span>` : diff === 0 ? " · 어제와 같아요" : ""}</div>
        <div class="mm">최저 <b class="num">${d0.tmn != null ? Math.round(d0.tmn) : "–"}°</b> · 최고 <b class="num">${d0.tmx != null ? Math.round(d0.tmx) : "–"}°</b></div></div>
       <div class="rain ${rain[1] ? "wet" : ""}">${icon(rain[1] ? "w-umbrella" : night ? "w-moon" : "w-sun", "")}<span>${esc(rain[0])}</span></div>`;

    // 칩: 습도·바람·강수·미세·초미세·일출/일몰. 체감온도는 겨울식이 맞는 때(10° 이하·바람 1.3m/s 이상)만
    const s0 = sun(k), ws = num(nw.wsd), vec = num(nw.vec);
    const chips = [];
    if (t != null && ws != null && t <= 10 && ws >= 1.3) {
      const v = Math.pow(ws * 3.6, .16), wc = 13.12 + .6215 * t - 11.37 * v + .3965 * v * t;
      chips.push(["체감온도", Math.round(wc) + "°", "바람 때문에"]);
    }
    chips.push(["습도", (nw.reh ?? first.reh ?? "–") + "%", ""]);
    chips.push(["바람", (vec != null ? arrow(vec) : "") + (ws != null ? ws + "<small style='font-size:13px;display:inline'>m/s</small>" : "–"), vec != null ? DIR[Math.round(vec / 22.5) % 16] + "풍" : ""]);
    if (chips.length < 4) chips.push(["1시간 강수", (num(nw.rn1) ?? 0) + "mm", "지금 관측"]);
    if (A) {
      chips.push(["미세먼지", esc(A.pm10_grade || "–"), A.pm10 && A.pm10 !== "-" ? A.pm10 + "㎍/㎥" : "측정 쉬는 중", GRADE_CLASS[A.pm10_grade]]);
      chips.push(["초미세먼지", esc(A.pm25_grade || "–"), A.pm25 && A.pm25 !== "-" ? A.pm25 + "㎍/㎥" : "측정 쉬는 중", GRADE_CLASS[A.pm25_grade]]);
    }
    chips.push(["일출 · 일몰", hhmm(s0.rise), "일몰 " + hhmm(s0.set)]);
    $("chips").innerHTML = chips.slice(0, 6).map(([a, b, c, g]) =>
      `<div class="wc"><small>${a}</small><b class="num ${g || ""}">${b}</b><span>${c}</span></div>`).join("");

    // 시간별: 앞으로 30시간. 기온은 선 그래프, 날짜가 바뀌는 칸에 '내일'
    const H = hourly.slice(0, 30);
    $("hours-note").textContent = H.length ? `${+H[0].h.slice(0, 2)}시부터 ${H.length}시간` : "";
    const temps = H.map(h => num(h.tmp)), lo = Math.min(...temps), hi = Math.max(...temps), CW = 58;
    const yOf = v => 58 - (hi === lo ? .5 : (v - lo) / (hi - lo)) * 40;
    const pts = temps.map((v, i) => [i * CW + CW / 2, yOf(v)]);
    const anyRain = H.some(h => num(h.pcp) > 0 || /mm|미만/.test(h.pcp || ""));
    const cols = H.map((h, i) => {
      const nd = i > 0 && h.d !== H[i - 1].d, x = dateOf(h.d);
      const label = i === 0 ? "지금" : nd ? (h.d === ymd(new Date(k.getTime() + 864e5)) ? "내일" : `${x.getDate()}일(${DAYS[x.getDay()]})`) : +h.h.slice(0, 2) + "시";
      const [im, alt] = wxIcon(h.sky, h.pty, isNight(h.d, h.h));
      const pcp = h.pcp && h.pcp !== "강수없음" && h.pcp !== "0" ? h.pcp.replace("mm", "") : "–";
      return `<div class="hcol${nd ? " first" : ""}"><div class="h${nd ? " day" : ""}">${label}</div>${icon(im, alt)}<div class="tmp"></div>
        <div class="pop${+h.pop >= 30 ? " hi" : ""}">${h.pop ?? "–"}%</div>
        ${anyRain ? `<div class="row2">${esc(pcp)}</div>` : ""}
        <div class="row2">${h.reh ?? "–"}%</div>
        <div class="row2 wind">${h.vec != null ? arrow(h.vec) : ""}${h.wsd ?? ""}</div></div>`;
    }).join("");
    const svg = `<svg class="hline" width="${H.length * CW}" height="74" aria-hidden="true">
      <polyline points="${pts.map(p => p.join(",")).join(" ")}" fill="none" stroke="#FFA94D" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#fff" stroke="#FF922B" stroke-width="2"/><text x="${p[0]}" y="${p[1] - 9}">${Math.round(temps[i])}°</text>`).join("")}</svg>`;
    $("hours").innerHTML = `<div class="hgrid" style="width:${H.length * CW}px">${cols}${svg}</div>`;
    const keys = document.querySelector(".hkeys");
    keys.insertAdjacentHTML("afterbegin", `<span>칸 아래: 강수확률${anyRain ? " · 강수량(mm)" : ""} · 습도 · 바람(m/s)</span>`);

    // 날짜별: 단기예보 4일 + 그다음 날부터 중기예보(10일째까지, 8일째부터는 오전·오후가 같은 값)
    const M = (S.mid || {}).data, short = w.days || [];
    const days = short.concat(((M && M.days) || []).filter(d => d.date >= today && !short.some(s => s.date === d.date)));
    const all = days.flatMap(d => [num(d.tmn), num(d.tmx)]).filter(v => v != null);
    const dmin = Math.min(...all), dmax = Math.max(...all);
    $("days").innerHTML = days.map((d, i) => {
      const x = dateOf(d.date), dow = x.getDay();
      const name = i === 0 && d.date === today ? "오늘" : d.date === ymd(new Date(k.getTime() + 864e5)) ? "내일" : DAYS[dow] + "요일";
      const half = (p, tag) => { if (!p) return `<div class="half"></div>`; const [im, alt] = p.wf ? wfIcon(p.wf) : wxIcon(p.sky, p.pty, false); return `<div class="half">${icon(im, tag + " " + alt)}<em class="${+p.pop >= 30 ? "hi" : ""}">${p.pop ?? "–"}%</em></div>`; };
      const a = num(d.tmn), b = num(d.tmx), L = a != null ? (a - dmin) / (dmax - dmin || 1) * 100 : 0, R = b != null ? (b - dmin) / (dmax - dmin || 1) * 100 : 100;
      return `<li><div class="d ${dow === 0 ? "sun" : dow === 6 ? "sat" : ""}"><b>${name}</b><small>${x.getMonth() + 1}.${x.getDate()}</small></div>
        ${half(d.am, "오전")}${half(d.pm, "오후")}
        <div class="tr num"><span class="lo">${a != null ? Math.round(a) + "°" : "–"}</span><span class="bar"><i style="left:${L}%;right:${100 - R}%"></i></span><span class="hi2">${b != null ? Math.round(b) + "°" : "–"}</span></div></li>`;
    }).join("") || "<li>예보를 불러오지 못했어요.</li>";

    // 공기: 에어코리아 값·등급을 그대로(3유형, 변경 금지)
    if (A) {
      $("air-note").textContent = `에어코리아 이동읍 측정소 · ${(A.time || "").slice(5).replace("-", ".")} 측정 · 확정 전 값`;
      const cell = (label, grade, val, unit) => `<div class="${GRADE_CLASS[grade] || ""}"><small>${label}</small><b>${esc(grade || "–")}</b><span>${val && val !== "-" ? esc(val) + " " + unit : "측정 쉬는 중"}</span></div>`;
      $("air").innerHTML = cell("미세먼지", A.pm10_grade, A.pm10, "㎍/㎥") + cell("초미세먼지", A.pm25_grade, A.pm25, "㎍/㎥") +
        cell("오존", A.o3_grade, A.o3, "ppm") + cell("통합대기지수", A.khai_grade, A.khai, "");
    } else $("air").innerHTML = "<div>공기 정보를 불러오지 못했어요.</div>";

    $("src").innerHTML = `출처: 기상청 단기예보·초단기실황(공공누리 1유형, ${w.fcst_base ? w.fcst_base.slice(8, 10) + "시 발표" : ""})` +
      (M ? ` · 중기예보(서울·인천·경기 육상, 용인 기온, ${M.tmfc.slice(6, 8)}일 ${M.tmfc.slice(8, 10)}시 발표)` : "") + ` · 기상특보 · 한국환경공단 에어코리아(값을 고치지 않고 그대로). ` +
      `이동읍 천리 부근 5km 격자 하나로 이동·남사를 함께 봅니다. 5일째부터는 경기 남부 넓은 구역 예보라 덜 자세해요. 일출·일몰은 위치로 계산한 값(오차 1~2분). ` +
      `<a href="https://www.weather.go.kr" rel="noopener" target="_blank">기상청 날씨누리</a>`;
  }).catch(() => { $("meta").textContent = "날씨를 불러오지 못했어요. 잠시 뒤 다시 열어 주세요."; });
})();
</script>
</body>
</html>
