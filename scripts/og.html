<!doctype html>
<!-- 링크 미리보기 그림 og.png 원본(1200×630, 2026-10-26 도메인 연결 때 지금 화면 색으로 다시). 만들기: python scripts/build_og.py
     색은 style.css 토큰 값을 그대로 옮겼다. 카카오톡은 가운데를 잘라 보여 줄 때가 있어 글은 왼쪽·가운데에 모은다. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  :root { --bg: #F2F4F6; --surface: #FFFFFF; --ink: #191F28; --ink-2: #4E5968; --line: #E5E8EB;
          --moss: #0E8A5A; --leaf: #2FC67A; --clay-ink: #C2410C; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: var(--bg); color: var(--ink);
         font-family: "Pretendard Variable", Pretendard, sans-serif; word-break: keep-all; -webkit-font-smoothing: antialiased; }
  .card { position: absolute; inset: 0; padding: 64px 72px 0; }
  .glow { position: absolute; right: -220px; top: -260px; width: 760px; height: 760px;
          background: radial-gradient(closest-side, rgba(47, 198, 122, .20), rgba(47, 198, 122, 0)); }
  .brand { display: flex; align-items: center; gap: 18px; position: relative; }
  .brand img { width: 68px; height: 68px; border-radius: 17px; box-shadow: 0 6px 18px rgba(14, 138, 90, .25); }
  .brand b { font-size: 34px; font-weight: 800; letter-spacing: -.02em; }
  .brand span { font-size: 24px; color: var(--ink-2); font-weight: 500; margin-left: 2px; }
  h1 { position: relative; margin-top: 58px; font-size: 74px; line-height: 1.2; font-weight: 800; letter-spacing: -.035em; }
  h1 em { font-style: normal; color: var(--moss); }
  .sub { position: relative; margin-top: 22px; font-size: 27px; color: var(--ink-2); font-weight: 500; letter-spacing: -.01em; }
  .sub b { color: var(--clay-ink); font-weight: 700; }
  .foot { position: absolute; left: 72px; right: 72px; bottom: 54px; display: flex; align-items: center; justify-content: space-between; }
  .chips { display: flex; gap: 12px; }
  .chip { display: flex; align-items: center; gap: 8px; padding: 10px 18px 10px 12px; background: var(--surface);
          border-radius: 999px; font-size: 22px; font-weight: 700; color: var(--ink);
          box-shadow: 0 1px 2px rgba(25, 31, 40, .04), 0 6px 18px rgba(25, 31, 40, .06); }
  .chip img { width: 34px; height: 34px; }
  .url { font-size: 30px; font-weight: 800; color: var(--moss); letter-spacing: -.02em; }
</style>
</head>
<body>
<div class="card">
  <div class="glow"></div>
  <div class="brand"><img src="../img/icon/icon-512.png" alt=""><b>이남노트</b><span>이동·남사 길잡이</span></div>
  <h1>반도체 산단이 들어오는 동네,<br><em>필요한 건 한곳에서.</em></h1>
  <p class="sub">장소·버스·소식·혜택을 <b>출처와 날짜</b>를 붙여 정리합니다</p>
  <div class="foot">
    <div class="chips">
      <span class="chip"><img src="../img/emoji/map.webp" alt="">장소 찾기</span>
      <span class="chip"><img src="../img/emoji/bus.webp" alt="">버스 도착</span>
      <span class="chip"><img src="../img/emoji/news.webp" alt="">소식</span>
      <span class="chip"><img src="../img/emoji/gift.webp" alt="">혜택</span>
    </div>
    <span class="url">이동남사.com</span>
  </div>
</div>
</body>
</html>
