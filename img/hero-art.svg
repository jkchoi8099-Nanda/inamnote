<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <!-- 코드로 그린 분위기 그림(실제 장소 아님). 채택 시 나노 바나나 이미지로 교체 가능 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6F5F0"/>
      <stop offset=".55" stop-color="#F1EFE4"/>
      <stop offset="1" stop-color="#E9EBDD"/>
    </linearGradient>
    <radialGradient id="sun" cx="78%" cy="30%" r="38%">
      <stop offset="0" stop-color="#F6E3C8" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#F3E7D2" stop-opacity=".55"/>
      <stop offset="1" stop-color="#F6F5F0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="h1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9D3BC"/><stop offset="1" stop-color="#DCE2D0"/></linearGradient>
    <linearGradient id="h2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A7B996"/><stop offset="1" stop-color="#C5D0B4"/></linearGradient>
    <linearGradient id="h3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7E9A6E"/><stop offset="1" stop-color="#9DB089"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E4E9DC"/><stop offset="1" stop-color="#F3F2EA"/></linearGradient>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F6F5F0" stop-opacity="1"/>
      <stop offset=".38" stop-color="#F6F5F0" stop-opacity=".9"/>
      <stop offset=".62" stop-color="#F6F5F0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeB" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".7" stop-color="#F6F5F0" stop-opacity="0"/>
      <stop offset="1" stop-color="#F6F5F0" stop-opacity="1"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="mist" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1440" height="900" fill="url(#sky)"/>
  <rect width="1440" height="900" fill="url(#sun)"/>
  <circle cx="1120" cy="250" r="70" fill="#F4D9B4" opacity=".55" filter="url(#mist)"/>
  <path d="M-100 520 C200 500 400 460 520 470 C640 400 760 380 880 400 C980 300 1080 280 1180 330 C1280 270 1380 300 1440 330 L1440 900 L-100 900 Z" fill="url(#h1)" filter="url(#soft)"/>
  <ellipse cx="1050" cy="470" rx="420" ry="40" fill="#F6F5F0" opacity=".55" filter="url(#mist)"/>
  <path d="M-100 600 C200 580 450 560 600 540 C720 470 860 450 980 480 C1080 420 1200 410 1300 450 C1360 430 1410 440 1440 450 L1440 900 L-100 900 Z" fill="url(#h2)" filter="url(#soft)"/>
  <path d="M-100 650 C200 645 400 642 560 640 C700 620 860 610 1000 625 C1150 612 1300 618 1440 630 L1440 900 L-100 900 Z" fill="url(#water)"/>
  <g stroke="#FFFFFF" stroke-linecap="round" opacity=".75">
    <path d="M760 672 h90" stroke-width="2"/><path d="M900 690 h140" stroke-width="2"/><path d="M1080 668 h70" stroke-width="2"/>
    <path d="M1180 700 h120" stroke-width="2"/><path d="M820 720 h60" stroke-width="1.5"/><path d="M1010 735 h110" stroke-width="1.5"/>
  </g>
  <path d="M-100 680 C200 640 400 610 520 600 C620 560 700 560 780 590 C860 615 960 660 1060 720 C1120 760 1160 820 1180 900 L-100 900 Z" fill="url(#h3)" opacity=".85" filter="url(#soft)"/>
  <path d="M1080 740 C1160 640 1260 575 1340 565 C1390 560 1420 562 1440 566 L1440 900 L1000 900 C1020 840 1045 785 1080 740 Z" fill="url(#h3)" opacity=".75" filter="url(#soft)"/>
  <g fill="none" stroke="#3F6B4F" stroke-width="2" stroke-linecap="round" opacity=".55">
    <path d="M1010 330 q8 -7 16 0 q8 -7 16 0"/><path d="M1062 300 q6 -5 12 0 q6 -5 12 0"/><path d="M1100 342 q5 -4 10 0 q5 -4 10 0"/>
  </g>
  <rect width="1440" height="900" fill="url(#fadeL)"/>
  <rect width="1440" height="900" fill="url(#fadeB)"/>
</svg>
